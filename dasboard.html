<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      min-height: 100vh;
      background-color: #f0f2f5;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #1f2937;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      margin-bottom: 30px;
      font-size: 22px;
      text-align: center;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .sidebar a:hover {
      background-color: #374151;
    }

    /* Main content */
    .main {
      flex: 1;
      padding: 20px;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .main-header h1 {
      font-size: 26px;
      color: #333;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card h3 {
      font-size: 18px;
      color: #555;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 24px;
      font-weight: bold;
      color: #111;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .sidebar {
        display: none;
      }

      .main {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Mon Dashboard</h2>
    <a href="#">Accueil</a>
    <a href="#">Utilisateurs</a>
    <a href="#">Statistiques</a>
    <a href="#">Messages</a>
    <a href="#">Paramètres</a>
    <a href="#">Déconnexion</a>
  </div>

  <div class="main">
    <div class="main-header">
      <h1>Tableau de bord</h1>
      <span>👋 Bonjour, utilisateur !</span>
    </div>

    <div class="cards">
      <div class="card">
        <h3>Utilisateurs</h3>
        <p>124</p>
      </div>
      <div class="card">
        <h3>Messages</h3>
        <p>87</p>
      </div>
      <div class="card">
        <h3>Visites</h3>
        <p>3.2K</p>
      </div>
      <div class="card">
        <h3>Ventes</h3>
        <p>€1,245</p>
      </div>
    </div>

    <div class="footer">
      &copy; 2025 - Dashboard simple par ChatGPT
    </div>
  </div>

</body>
</html>
