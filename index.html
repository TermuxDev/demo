<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TermuxDev | Profil System</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent-dev: #2ea44f;
      --accent-sec: #da3633;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: monospace, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .header {
      background-color: #21262d;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header .title {
      font-weight: bold;
      color: #58a6ff;
    }

    .badge {
      font-size: 0.8em;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .content {
      padding: 24px;
    }

    .duality-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (max-width: 480px) {
      .duality-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }

    .card.dev {
      border-left: 3px solid var(--accent-dev);
    }

    .card.sec {
      border-left: 3px solid var(--accent-sec);
    }

    .card h3 {
      font-size: 1.1em;
      margin-bottom: 8px;
    }

    .card.dev h3 { color: var(--accent-dev); }
    .card.sec h3 { color: var(--accent-sec); }

    .card p {
      font-size: 0.9em;
      line-height: 1.4;
      color: #8b949e;
    }

    form {
      margin-top: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9em;
      color: #8b949e;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      background-color: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      margin-bottom: 16px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #58a6ff;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #2ea44f;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="title">~/TermuxDev</span>
      <span class="badge">Dual Mode</span>
    </div>

    <div class="content">
      <div class="duality-grid">
        <div class="card dev">
          <h3>[+] Builder</h3>
          <p>Développement d'outils, écriture d'applications CLI et scripts d'automatisation directement depuis l'environnement mobile.</p>
        </div>
        <div class="card sec">
          <h3>[*] Security</h3>
          <p>Analyse de systèmes, tests d'intrusion et exploration des mécanismes de sécurité réseau en mobilité.</p>
        </div>
      </div>

      <form id="form">
        <label for="name">Identifiant / Nom :</label>
        <input type="text" id="name" name="name" placeholder="Entrez votre nom..." required autocomplete="off">
        <button type="submit">Connexion</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const nom = form.name.value;
      alert('Bienvenue ' + nom);
    });
  </script>

</body>
</html>
